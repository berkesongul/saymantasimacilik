# VPS üzerindeki /etc/nginx/sites-available/saymantasimacilik.com dosyası için örnek.
# HTTPS sertifikasını mevcut Nginx/Certbot düzeninizde ayrıca kurun.
server {
    listen 80;
    server_name saymantasimacilik.com www.saymantasimacilik.com;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
